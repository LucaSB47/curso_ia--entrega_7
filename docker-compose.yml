version: '3.8'

services:
  redis:
  image: redis/redis-stack-server:latest
  ports:
    - "6379:6379"
  volumes:
    - redis_data:/data
  command: ["redis-stack-server", "--appendonly", "yes"]
  restart: unless-stopped
  
  volumes:
    redis_data:

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
    depends_on:
      - redis
    restart: always